services:
  postgres:
    image: postgres:15-alpine
    container_name: empresa-facil-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: empresafacil
    ports:
      - "5432:5432"
    volumes:
      - ef_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empresafacil"]
      interval: 5s
      timeout: 5s
      retries: 10

  sync-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: empresa-facil-sync-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3333
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/empresafacil
      SYNC_PULL_LIMIT: 500
    ports:
      - "3333:3333"

volumes:
  ef_pg_data:
