<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmpresaFacil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: 'Figtree', sans-serif; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
    * { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ef-ui.jsx"></script>
<script type="text/babel" src="ef-screens.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "darkMode": false,
  "colorScheme": "verde",
  "compact": false
}/*EDITMODE-END*/;

// ── Icons ──────────────────────────────────────────────────────────────────
const IcoDash = () => <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="2" fill="currentColor"/><rect x="10" y="2" width="6" height="6" rx="2" fill="currentColor" opacity=".4"/><rect x="2" y="10" width="6" height="6" rx="2" fill="currentColor" opacity=".4"/><rect x="10" y="10" width="6" height="6" rx="2" fill="currentColor" opacity=".4"/></svg>;
const IcoPlus = () => <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3v12M3 9h12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoDRE = () => <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 14V8M7 14V4M11 14V10M15 14V6" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoClose = () => <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M14 4l-5 5-5-5M4 14l5-5 5 5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const IcoImport = () => <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3v9M5 8l4 4 4-4" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/><path d="M3 15h12" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>;
const IcoBldg = () => <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="6" width="12" height="10" rx="1.5" stroke="currentColor" strokeWidth="1.5"/><path d="M6 16V11h6v5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/><path d="M6 6V4a3 3 0 016 0v2" stroke="currentColor" strokeWidth="1.5"/></svg>;

// ── NavItem ─────────────────────────────────────────────────────────────────
const NavItem = ({ icon, label, active, onClick, sidebarBg, t }) => {
  const [h, sh] = React.useState(false);
  return (
    <button onClick={onClick} onMouseEnter={() => sh(true)} onMouseLeave={() => sh(false)}
      style={{
        display: 'flex', alignItems: 'center', gap: '10px',
        padding: '9px 14px', borderRadius: '9px', border: 'none', cursor: 'pointer',
        background: active ? t.sidebarActiveBg : (h ? 'rgba(255,255,255,0.06)' : 'transparent'),
        color: active ? t.sidebarActive : t.sidebarText,
        fontSize: '14px', fontWeight: active ? 700 : 500, fontFamily: 'inherit',
        width: '100%', textAlign: 'left', transition: 'all .15s',
      }}>
      {icon}
      <span>{label}</span>
    </button>
  );
};

// ── Sidebar ─────────────────────────────────────────────────────────────────
const Sidebar = ({ screen, onNav, company, onCompany, t }) => {
  const [hover, setHover] = React.useState(false);
  const nav = [
    { id: 'dashboard', icon: <IcoDash />, label: 'Dashboard' },
    { id: 'lancamento', icon: <IcoPlus />, label: 'Registrar' },
    { id: 'dre', icon: <IcoDRE />, label: 'DRE Mensal' },
    { id: 'fechamento', icon: <IcoClose />, label: 'Fechamento' },
    { id: 'importar', icon: <IcoImport />, label: 'Importar' },
  ];

  return (
    <div style={{
      width: 220, flexShrink: 0, background: t.sidebarBg,
      display: 'flex', flexDirection: 'column', height: '100%',
      padding: '0 10px 16px',
    }}>
      {/* Logo */}
      <div style={{ padding: '20px 6px 16px', display: 'flex', alignItems: 'center', gap: '10px' }}>
        <div style={{ width: 32, height: 32, borderRadius: '9px', background: 'rgba(255,255,255,0.12)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="10" width="5" height="6" rx="1" fill="white"/>
            <rect x="9" y="6" width="5" height="10" rx="1" fill="white" opacity="0.7"/>
            <rect x="5.5" y="2" width="5" height="14" rx="1" fill="white" opacity="0.9"/>
          </svg>
        </div>
        <span style={{ fontSize: '15px', fontWeight: 800, color: '#fff', letterSpacing: '-0.01em' }}>EmpresaFacil</span>
      </div>

      {/* Company switcher */}
      <button onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
        onClick={() => onNav('empresas')}
        style={{
          margin: '0 0 12px', padding: '10px 12px', borderRadius: '10px',
          background: hover ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.06)',
          border: '1px solid rgba(255,255,255,0.1)', cursor: 'pointer',
          display: 'flex', alignItems: 'center', gap: '10px', transition: 'all .15s'
        }}>
        <div style={{ width: 30, height: 30, borderRadius: '8px', background: 'rgba(255,255,255,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '13px', fontWeight: 800, color: '#fff', flexShrink: 0 }}>
          {(company || EF_DATA.companies[0]).name.charAt(0)}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: '13px', fontWeight: 700, color: '#fff', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
            {(company || EF_DATA.companies[0]).name}
          </div>
          <div style={{ fontSize: '11px', color: t.sidebarText }}>{(company || EF_DATA.companies[0]).type} · Maio 2026</div>
        </div>
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" style={{ flexShrink: 0, opacity: 0.5 }}>
          <path d="M3 4.5l3 3 3-3" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>

      {/* Nav */}
      <div style={{ display: 'flex', flexDirection: 'column', gap: '2px', flex: 1 }}>
        {nav.map(n => (
          <NavItem key={n.id} icon={n.icon} label={n.label}
            active={screen === n.id} onClick={() => onNav(n.id)} t={t} />
        ))}
      </div>

      {/* Bottom */}
      <div style={{ borderTop: '1px solid rgba(255,255,255,0.08)', paddingTop: '12px' }}>
        <NavItem icon={<IcoBldg />} label="Empresas" active={screen === 'empresas'} onClick={() => onNav('empresas')} t={t} />
      </div>
    </div>
  );
};

// ── BottomNav ───────────────────────────────────────────────────────────────
const BottomNav = ({ screen, onNav, t }) => {
  const nav = [
    { id: 'dashboard', icon: <IcoDash />, label: 'Início' },
    { id: 'lancamento', icon: <IcoPlus />, label: 'Registrar' },
    { id: 'dre', icon: <IcoDRE />, label: 'DRE' },
    { id: 'fechamento', icon: <IcoClose />, label: 'Fechar' },
    { id: 'importar', icon: <IcoImport />, label: 'Importar' },
  ];
  return (
    <div style={{
      display: 'flex', background: t.card,
      borderTop: `1px solid ${t.border}`, padding: '4px 0 env(safe-area-inset-bottom, 4px)',
      flexShrink: 0,
    }}>
      {nav.map(n => {
        const active = screen === n.id;
        return (
          <button key={n.id} onClick={() => onNav(n.id)}
            style={{
              flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center',
              gap: '3px', padding: '8px 4px', border: 'none', background: 'none',
              cursor: 'pointer', color: active ? t.green : t.text3,
              fontFamily: 'inherit', fontSize: '10px', fontWeight: active ? 700 : 500,
              transition: 'color .15s',
            }}>
            {n.icon}
            <span>{n.label}</span>
          </button>
        );
      })}
    </div>
  );
};

// ── Modal Lancamento ────────────────────────────────────────────────────────
const ModalLancamento = ({ open, onClose, t }) => {
  if (!open) return null;
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 200, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px' }}>
      <div onClick={onClose} style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.45)', backdropFilter: 'blur(3px)' }}></div>
      <div style={{
        position: 'relative', width: '100%', maxWidth: '500px',
        background: t.card, borderRadius: '18px',
        boxShadow: '0 24px 80px rgba(0,0,0,0.22)',
        maxHeight: '92vh', overflowY: 'auto',
      }}>
        <ScreenLancamento onClose={onClose} onSuccess={onClose} />
      </div>
    </div>
  );
};

// ── Main App ────────────────────────────────────────────────────────────────
const App = () => {
  const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);
  const dark = tweaks.darkMode;
  const compact = tweaks.compact;

  const colorOverrides = {
    verde: {},
    azul: { green: '#1A3A5C', greenMid: '#2A5C8C', greenLite: '#E8F0F8', sidebarBg: '#1A3A5C', pos: '#2A5C8C', posBg: '#EFF6FF' },
    roxo: { green: '#5B21B6', greenMid: '#7C3AED', greenLite: '#F3F0FF', sidebarBg: '#3B1D8C', pos: '#7C3AED', posBg: '#F3F0FF' },
  };

  const baseTokens = EFTokens[dark ? 'dark' : 'light'];
  const tokens = { ...baseTokens, ...(colorOverrides[tweaks.colorScheme] || {}) };

  const [screen, setScreen] = React.useState('dashboard');
  const [lancOpen, setLancOpen] = React.useState(false);
  const [company, setCompany] = React.useState(EF_DATA.companies[0]);
  const [isMobile, setMobile] = React.useState(window.innerWidth < 768);

  React.useEffect(() => {
    const fn = () => setMobile(window.innerWidth < 768);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);

  const handleNav = (id) => {
    if (id === 'lancamento') { setLancOpen(true); }
    else { setScreen(id); }
  };

  const contentPad = compact ? '16px' : isMobile ? '16px' : '32px';

  const screens = {
    dashboard: <ScreenDashboard onLancar={() => setLancOpen(true)} company={company} />,
    dre: <ScreenDRE />,
    fechamento: <ScreenFechamento />,
    importar: <ScreenImportar />,
    empresas: <ScreenEmpresas company={company} onSwitch={c => { setCompany(c); setScreen('dashboard'); }} />,
  };

  return (
    <EFTK.Provider value={tokens}>
      <div style={{
        display: 'flex', flexDirection: 'column', height: '100vh',
        background: tokens.bg, color: tokens.text,
        fontFamily: "'Figtree', sans-serif",
      }}>
        <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
          {/* Sidebar — desktop only */}
          {!isMobile && (
            <Sidebar screen={screen} onNav={handleNav} company={company} onCompany={setCompany} t={tokens} />
          )}

          {/* Main content */}
          <div style={{ flex: 1, overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
            {/* Mobile header */}
            {isMobile && (
              <div style={{
                display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                padding: '14px 16px', background: tokens.sidebarBg, flexShrink: 0,
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <div style={{ width: 28, height: 28, borderRadius: '8px', background: 'rgba(255,255,255,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
                      <rect x="2" y="10" width="5" height="6" rx="1" fill="white"/>
                      <rect x="9" y="6" width="5" height="10" rx="1" fill="white" opacity="0.7"/>
                      <rect x="5.5" y="2" width="5" height="14" rx="1" fill="white" opacity="0.9"/>
                    </svg>
                  </div>
                  <span style={{ fontSize: '15px', fontWeight: 800, color: '#fff' }}>EmpresaFacil</span>
                </div>
                <button onClick={() => handleNav('empresas')}
                  style={{ background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: '8px', padding: '6px 10px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <span style={{ fontSize: '12px', fontWeight: 700, color: '#fff' }}>{company.name.split(' ')[0]}</span>
                  <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </button>
              </div>
            )}

            <div style={{ padding: contentPad, flex: 1 }}>
              <div style={{ maxWidth: 860, margin: '0 auto' }}>
                {screens[screen] || screens.dashboard}
              </div>
            </div>
          </div>
        </div>

        {/* Bottom nav — mobile only */}
        {isMobile && <BottomNav screen={screen} onNav={handleNav} t={tokens} />}
      </div>

      {/* Lançamento modal */}
      <ModalLancamento open={lancOpen} onClose={() => setLancOpen(false)} t={tokens} />

      {/* Tweaks panel */}
      <TweaksPanel tweaks={tweaks} setTweak={(k, v) => setTweaks(prev => ({ ...prev, [k]: v }))}>
        <TweakSection title="Aparência">
          <TweakToggle label="Modo escuro" tweakKey="darkMode" tweaks={tweaks} setTweak={(k,v) => setTweaks(p => ({...p,[k]:v}))} />
          <TweakToggle label="Layout compacto" tweakKey="compact" tweaks={tweaks} setTweak={(k,v) => setTweaks(p => ({...p,[k]:v}))} />
        </TweakSection>
        <TweakSection title="Cor principal">
          <TweakRadio label="" tweakKey="colorScheme" tweaks={tweaks} setTweak={(k,v) => setTweaks(p => ({...p,[k]:v}))}
            options={[{value:'verde',label:'Verde'},{value:'azul',label:'Azul'},{value:'roxo',label:'Roxo'}]} />
        </TweakSection>
        <TweakSection title="Navegação">
          <TweakButton label="→ Dashboard" onClick={() => setScreen('dashboard')} />
          <TweakButton label="→ DRE Mensal" onClick={() => setScreen('dre')} />
          <TweakButton label="→ Fechamento" onClick={() => setScreen('fechamento')} />
          <TweakButton label="→ Importar" onClick={() => setScreen('importar')} />
          <TweakButton label="→ Empresas" onClick={() => setScreen('empresas')} />
          <TweakButton label="Abrir Registrar" onClick={() => setLancOpen(true)} />
        </TweakSection>
      </TweaksPanel>
    </EFTK.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
